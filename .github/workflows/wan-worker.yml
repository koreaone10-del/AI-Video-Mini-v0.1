name: Wan2.1 T2V Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Render Job ID"
        required: true
        type: string

      prompt:
        description: "Video prompt"
        required: true
        type: string

      aspect_ratio:
        description: "Aspect ratio"
        required: true
        type: string
        default: "16:9"

      duration:
        description: "Requested duration in seconds"
        required: true
        type: string
        default: "5"

  repository_dispatch:
    types:
      - ai_video_job

permissions:
  contents: read

jobs:
  generate:
    name: Wan2.1 CPU Worker
    runs-on: ubuntu-24.04

    env:
      RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
      RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}

    steps:

      # ============================================================
      # 1. PREPARE JOB
      # ============================================================

      - name: Prepare job variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            JOB_ID="${{ github.event.client_payload.job_id }}"
            PROMPT="${{ github.event.client_payload.prompt }}"
            ASPECT_RATIO="${{ github.event.client_payload.aspect_ratio }}"
            DURATION="${{ github.event.client_payload.duration }}"
          else
            JOB_ID="${{ inputs.job_id }}"
            PROMPT="${{ inputs.prompt }}"
            ASPECT_RATIO="${{ inputs.aspect_ratio }}"
            DURATION="${{ inputs.duration }}"
          fi

          case "$ASPECT_RATIO" in
            "16:9")
              SIZE="832*480"
              ;;
            "9:16")
              SIZE="480*832"
              ;;
            "1:1")
              SIZE="480*480"
              ;;
            *)
              echo "Unsupported aspect ratio: $ASPECT_RATIO"
              exit 1
              ;;
          esac

          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "PROMPT=$PROMPT" >> "$GITHUB_ENV"
          echo "ASPECT_RATIO=$ASPECT_RATIO" >> "$GITHUB_ENV"
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"

          # CPU proof test.
          # Keep these values unchanged for now.
          echo "FRAME_NUM=9" >> "$GITHUB_ENV"
          echo "SAMPLE_STEPS=4" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "Prepared Wan2.1 CPU job"
          echo "=============================================="
          echo "Job ID:        $JOB_ID"
          echo "Prompt:        $PROMPT"
          echo "Aspect:        $ASPECT_RATIO"
          echo "Duration:      $DURATION"
          echo "Size:          $SIZE"
          echo "Frame number:  9"
          echo "Sample steps:  4"
          echo "=============================================="

      # ============================================================
      # 2. CALLBACK - STARTING
      # ============================================================

      - name: Callback - Starting
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback-start.json
          import json
          import os

          payload = {
              "status": "running",
              "progress": 2,
              "stage": "starting",
              "prompt": os.environ["PROMPT"],
              "aspect_ratio": os.environ["ASPECT_RATIO"],
              "duration": int(os.environ["DURATION"]),
          }

          print(json.dumps(payload))
          PY

          echo "Starting callback payload:"
          cat /tmp/callback-start.json

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback-start.json

      # ============================================================
      # 3. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            git \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            ca-certificates

          echo "=============================================="
          echo "System verification"
          echo "=============================================="

          ffmpeg -version | head -n 1
          python3 --version
          git --version
          curl --version | head -n 1

      # ============================================================
      # 5. HARDWARE CHECK
      # ============================================================

      - name: Check hardware
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Hardware"
          echo "=============================================="

          echo "CPU(s):"
          nproc

          echo
          echo "CPU model:"
          lscpu | grep -E "Model name|Socket|Core|Thread" | head -n 10 || true

          echo
          echo "RAM:"
          free -h

          echo
          echo "GPU:"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi || true
          else
            echo "No NVIDIA GPU detected."
          fi

          echo
          echo "Worker mode: CPU-compatible Wan2.1"

      # ============================================================
      # 6. CALLBACK - INSTALLING
      # ============================================================

      - name: Callback - Installing Wan2.1
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback-installing.json
          import json

          payload = {
              "status": "running",
              "progress": 8,
              "stage": "installing_wan",
          }

          print(json.dumps(payload))
          PY

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback-installing.json

      # ============================================================
      # 7. CLONE WAN2.1
      # ============================================================

      - name: Clone Wan2.1
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Wan2.1

          git clone \
            --depth 1 \
            https://github.com/Wan-Video/Wan2.1.git \
            Wan2.1

          cd Wan2.1

          echo "=============================================="
          echo "Wan2.1 commit"
          echo "=============================================="

          git rev-parse HEAD

      # ============================================================
      # 8. PATCH WAN2.1 FOR CPU
      # ============================================================

      - name: Patch Wan2.1 for CPU
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          python3 - <<'PY'
          from pathlib import Path
          import re

          print("==============================================")
          print("Applying Wan2.1 CPU compatibility patches")
          print("==============================================")

          # --------------------------------------------------------
          # PATCH 1
          # T5 import-time CUDA device
          # --------------------------------------------------------

          t5 = Path("wan/modules/t5.py")

          if not t5.exists():
              raise SystemExit(
                  "ERROR: wan/modules/t5.py was not found."
              )

          t5_text = t5.read_text()

          old_t5 = "device=torch.cuda.current_device()"
          new_t5 = "device='cpu'"

          if old_t5 in t5_text:
              t5_text = t5_text.replace(
                  old_t5,
                  new_t5,
                  1
              )
              t5.write_text(t5_text)
              print("PATCHED: wan/modules/t5.py")
          else:
              print(
                  "INFO: T5 CUDA default already patched "
                  "or upstream source changed."
              )

          # --------------------------------------------------------
          # PATCH 2
          # WanT2V device selection
          # --------------------------------------------------------

          t2v = Path("wan/text2video.py")

          if not t2v.exists():
              raise SystemExit(
                  "ERROR: wan/text2video.py was not found."
              )

          text = t2v.read_text()

          old_device = (
              'self.device = torch.device(f"cuda:{device_id}")'
          )

          new_device = '''self.device = torch.device(
              "cuda" if torch.cuda.is_available() else "cpu"
          )'''

          if old_device in text:
              text = text.replace(
                  old_device,
                  new_device,
                  1
              )
              print("PATCHED: text2video device selection")
          else:
              print(
                  "INFO: text2video device selection already patched "
                  "or upstream source changed."
              )

          # --------------------------------------------------------
          # PATCH 3
          # CPU-safe autocast
          # --------------------------------------------------------

          old_autocast = (
              "with amp.autocast(dtype=self.param_dtype), "
              "torch.no_grad(), no_sync():"
          )

          new_autocast = '''with torch.autocast(
                  device_type=self.device.type,
                  dtype=self.param_dtype,
                  enabled=(self.device.type == "cuda")
              ), torch.no_grad(), no_sync():'''

          if old_autocast in text:
              text = text.replace(
                  old_autocast,
                  new_autocast,
                  1
              )
              print("PATCHED: text2video autocast")
          else:
              print(
                  "INFO: text2video autocast already patched "
                  "or upstream source changed."
              )

          # --------------------------------------------------------
          # PATCH 4
          # CPU-safe torch.cuda.empty_cache()
          #
          # Regex captures the existing indentation.
          # This prevents the exact indentation bug from run #7.
          # --------------------------------------------------------

          empty_cache_pattern = re.compile(
              r"^(?P<indent>[ \t]*)"
              r"torch\.cuda\.empty_cache\(\)"
              r"[ \t]*$",
              re.MULTILINE
          )

          def replace_empty_cache(match):
              indent = match.group("indent")

              return (
                  f"{indent}if torch.cuda.is_available():\n"
                  f"{indent}    torch.cuda.empty_cache()"
              )

          text, empty_count = empty_cache_pattern.subn(
              replace_empty_cache,
              text
          )

          if empty_count:
              print(
                  f"PATCHED: torch.cuda.empty_cache() "
                  f"({empty_count} occurrence(s))"
              )
          else:
              print(
                  "INFO: torch.cuda.empty_cache() already patched "
                  "or no matching occurrence found."
              )

          # --------------------------------------------------------
          # PATCH 5
          # CPU-safe torch.cuda.synchronize()
          #
          # Regex captures the existing indentation.
          # --------------------------------------------------------

          synchronize_pattern = re.compile(
              r"^(?P<indent>[ \t]*)"
              r"torch\.cuda\.synchronize\(\)"
              r"[ \t]*$",
              re.MULTILINE
          )

          def replace_synchronize(match):
              indent = match.group("indent")

              return (
                  f"{indent}if torch.cuda.is_available():\n"
                  f"{indent}    torch.cuda.synchronize()"
              )

          text, sync_count = synchronize_pattern.subn(
              replace_synchronize,
              text
          )

          if sync_count:
              print(
                  f"PATCHED: torch.cuda.synchronize() "
                  f"({sync_count} occurrence(s))"
              )
          else:
              print(
                  "INFO: torch.cuda.synchronize() already patched "
                  "or no matching occurrence found."
              )

          t2v.write_text(text)

          # --------------------------------------------------------
          # FINAL SOURCE CHECKS
          # --------------------------------------------------------

          t5_text = t5.read_text()
          t2v_text = t2v.read_text()

          if "device=torch.cuda.current_device()" in t5_text:
              raise SystemExit(
                  "CPU PATCH FAILED: T5 still forces "
                  "torch.cuda.current_device()"
              )

          if (
              'self.device = torch.device(f"cuda:{device_id}")'
              in t2v_text
          ):
              raise SystemExit(
                  "CPU PATCH FAILED: WanT2V still forces CUDA"
              )

          print("==============================================")
          print("Source replacement checks: PASSED")
          print("==============================================")

          # --------------------------------------------------------
          # Show relevant source
          # --------------------------------------------------------

          print()
          print("Relevant CPU-safe lines:")

          for number, line in enumerate(
              t2v_text.splitlines(),
              start=1
          ):
              if any(
                  token in line
                  for token in [
                      "self.device = torch.device",
                      "torch.autocast",
                      "torch.cuda.empty_cache",
                      "torch.cuda.synchronize",
                      "torch.cuda.is_available",
                  ]
              ):
                  print(
                      f"{number}: {line}"
                  )
          PY

          # --------------------------------------------------------
          # REAL SYNTAX VALIDATION
          # --------------------------------------------------------

          echo
          echo "Checking patched Python files..."

          python3 -m py_compile \
            wan/modules/t5.py \
            wan/text2video.py

          echo
          echo "Python syntax check: PASSED"

      # ============================================================
      # 9. CREATE PYTHON ENVIRONMENT
      # ============================================================

      - name: Create Python environment
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          echo "Python:"
          python --version

          echo "Pip:"
          pip --version

      # ============================================================
      # 10. INSTALL CPU PYTORCH
      # ============================================================

      - name: Install CPU PyTorch
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          python -m pip install \
            --no-cache-dir \
            torch \
            torchvision \
            --index-url https://download.pytorch.org/whl/cpu

          python - <<'PY'
          import torch

          print("==============================================")
          print("PyTorch CPU verification")
          print("==============================================")

          print("Torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("CUDA version:", torch.version.cuda)

          if torch.cuda.is_available():
              raise RuntimeError(
                  "CPU worker unexpectedly reports CUDA available."
              )

          print("CPU PyTorch: OK")
          PY

      # ============================================================
      # 11. INSTALL WAN2.1 DEPENDENCIES
      # ============================================================

      - name: Install Wan2.1 dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          python -m pip install \
            --no-cache-dir \
            einops \
            diffusers \
            transformers \
            tokenizers \
            accelerate \
            tqdm \
            imageio \
            easydict \
            ftfy \
            imageio-ffmpeg \
            opencv-python \
            "numpy>=1.23.5,<2"

          echo "=============================================="
          echo "Wan2.1 dependencies installed"
          echo "=============================================="

      # ============================================================
      # 12. HUGGING FACE CLI
      # ============================================================

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          python -m pip install \
            --no-cache-dir \
            "huggingface_hub[cli]"

          hf --help >/dev/null

          echo "Hugging Face CLI: OK"

      # ============================================================
      # 13. VERIFY PATCHED WAN2.1
      # ============================================================

      - name: Verify patched Wan2.1
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          python - <<'PY'
          import sys
          import torch

          sys.path.insert(0, ".")

          print("==============================================")
          print("Patched Wan2.1 verification")
          print("==============================================")

          print("Torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())

          if torch.cuda.is_available():
              raise RuntimeError(
                  "CUDA is unexpectedly available."
              )

          import wan

          print("Wan import: OK")

          from wan.modules.t5 import T5EncoderModel

          print("T5 import: OK")

          from wan.text2video import WanT2V

          print("WanT2V import: OK")

          print("CPU compatibility import test: PASSED")
          PY

      # ============================================================
      # 14. CALLBACK - DOWNLOADING MODEL
      # ============================================================

      - name: Callback - Downloading model
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback-downloading.json
          import json

          payload = {
              "status": "running",
              "progress": 15,
              "stage": "downloading_model",
          }

          print(json.dumps(payload))
          PY

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback-downloading.json

      # ============================================================
      # 15. DOWNLOAD MODEL
      # ============================================================

      - name: Download Wan2.1 T2V 1.3B
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          rm -rf Wan2.1-T2V-1.3B

          hf download \
            Wan-AI/Wan2.1-T2V-1.3B \
            --local-dir ./Wan2.1-T2V-1.3B

          echo "=============================================="
          echo "Model download completed"
          echo "=============================================="

          du -sh ./Wan2.1-T2V-1.3B

      # ============================================================
      # 16. CALLBACK - GENERATING
      # ============================================================

      - name: Callback - Generating
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback-generating.json
          import json

          payload = {
              "status": "running",
              "progress": 30,
              "stage": "generating",
          }

          print(json.dumps(payload))
          PY

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback-generating.json

      # ============================================================
      # 17. GENERATE WAN2.1 CPU PROOF VIDEO
      # ============================================================

      - name: Generate Wan2.1 CPU proof video
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          export OMP_NUM_THREADS=4
          export MKL_NUM_THREADS=4
          export TOKENIZERS_PARALLELISM=false

          FINAL_VIDEO="/tmp/${JOB_ID}.mp4"

          echo "=============================================="
          echo "Wan2.1 CPU generation"
          echo "=============================================="
          echo "Job:          ${JOB_ID}"
          echo "Prompt:       ${PROMPT}"
          echo "Aspect:       ${ASPECT_RATIO}"
          echo "Size:         ${SIZE}"
          echo "Frames:       ${FRAME_NUM}"
          echo "Steps:        ${SAMPLE_STEPS}"
          echo "Mode:         CPU"
          echo "Offload:      True"
          echo "T5 CPU:       True"
          echo "=============================================="

          python generate.py \
            --task t2v-1.3B \
            --size "$SIZE" \
            --ckpt_dir ./Wan2.1-T2V-1.3B \
            --frame_num "$FRAME_NUM" \
            --sample_steps "$SAMPLE_STEPS" \
            --sample_shift 8 \
            --sample_guide_scale 6 \
            --offload_model True \
            --t5_cpu \
            --prompt "$PROMPT" \
            --save_file "$FINAL_VIDEO"

          if [ ! -f "$FINAL_VIDEO" ]; then
            echo "Generation completed but MP4 was not created."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "Generated file"
          echo "=============================================="

          ls -lh "$FINAL_VIDEO"

          echo
          echo "=============================================="
          echo "Video information"
          echo "=============================================="

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$FINAL_VIDEO"

          echo "FINAL_VIDEO=$FINAL_VIDEO" >> "$GITHUB_ENV"

      # ============================================================
      # 18. INSPECT FINAL VIDEO
      # ============================================================

      - name: Inspect final video
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "Final video missing."
            exit 1
          fi

          echo "=============================================="
          echo "Final video inspection"
          echo "=============================================="

          ls -lh "${FINAL_VIDEO}"

          ffprobe \
            -v error \
            -show_entries \
            format=duration \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "${FINAL_VIDEO}"

      # ============================================================
      # 19. CALLBACK - UPLOADING
      # ============================================================

      - name: Callback - Uploading
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback-uploading.json
          import json

          payload = {
              "status": "running",
              "progress": 80,
              "stage": "uploading",
          }

          print(json.dumps(payload))
          PY

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback-uploading.json

      # ============================================================
      # 20. UPLOAD VIDEO
      # ============================================================

      - name: Upload video to Render
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "FINAL_VIDEO does not exist."
            exit 1
          fi

          echo "Uploading:"
          ls -lh "${FINAL_VIDEO}"

          curl -sS -f \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/upload" \
            -H "Content-Type: video/mp4" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary "@${FINAL_VIDEO}"

          echo
          echo "Video uploaded successfully."

      # ============================================================
      # 21. CALLBACK - COMPLETED
      # ============================================================

      - name: Callback - Completed
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/completed.json
          import json
          import os

          payload = {
              "status": "completed",
              "progress": 100,
              "stage": "completed",
              "output_url": (
                  os.environ["RENDER_BASE_URL"]
                  + "/api/jobs/"
                  + os.environ["JOB_ID"]
                  + "/video"
              ),
          }

          print(json.dumps(payload))
          PY

          echo "Completion callback:"
          cat /tmp/completed.json

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/completed.json

      # ============================================================
      # 22. CALLBACK - FAILED
      # ============================================================

      - name: Callback - Failed
        if: failure()
        shell: bash
        run: |
          set +e

          python3 - <<'PY' > /tmp/failed.json
          import json

          payload = {
              "status": "failed",
              "progress": 0,
              "stage": "failed",
              "error": "GitHub Actions Wan2.1 worker failed.",
          }

          print(json.dumps(payload))
          PY

          echo "Failure callback:"
          cat /tmp/failed.json

          curl -sS \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/failed.json \
            || true
