name: Wan2.1 T2V Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Render Job ID"
        required: true
        type: string

      prompt:
        description: "Video prompt"
        required: true
        type: string

      aspect_ratio:
        description: "Aspect ratio"
        required: true
        type: string
        default: "16:9"

      duration:
        description: "Requested duration"
        required: true
        type: string
        default: "5"

  repository_dispatch:
    types:
      - ai_video_job

permissions:
  contents: read

jobs:
  generate:
    name: Wan2.1 CPU Worker
    runs-on: ubuntu-24.04

    env:
      RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
      RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}

    steps:

      # ==========================================================
      # 1. PREPARE JOB
      # ==========================================================

      - name: Prepare job variables
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            JOB_ID="${{ github.event.client_payload.job_id }}"
            PROMPT="${{ github.event.client_payload.prompt }}"
            ASPECT_RATIO="${{ github.event.client_payload.aspect_ratio }}"
            DURATION="${{ github.event.client_payload.duration }}"
          else
            JOB_ID="${{ inputs.job_id }}"
            PROMPT="${{ inputs.prompt }}"
            ASPECT_RATIO="${{ inputs.aspect_ratio }}"
            DURATION="${{ inputs.duration }}"
          fi

          case "$ASPECT_RATIO" in
            "16:9")
              SIZE="480*272"
              ;;
            "9:16")
              SIZE="272*480"
              ;;
            "1:1")
              SIZE="272*272"
              ;;
            *)
              echo "Unsupported aspect ratio: $ASPECT_RATIO"
              exit 1
              ;;
          esac

          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "PROMPT=$PROMPT" >> "$GITHUB_ENV"
          echo "ASPECT_RATIO=$ASPECT_RATIO" >> "$GITHUB_ENV"
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"

          # GOLDEN PROOF SETTINGS
          echo "FRAME_NUM=5" >> "$GITHUB_ENV"
          echo "SAMPLE_STEPS=2" >> "$GITHUB_ENV"
          echo "GUIDE_SCALE=1.0" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "GOLDEN WAN2.1 CPU JOB"
          echo "=============================================="
          echo "Job:       $JOB_ID"
          echo "Prompt:    $PROMPT"
          echo "Aspect:    $ASPECT_RATIO"
          echo "Duration:  $DURATION"
          echo "Size:      $SIZE"
          echo "Frames:    5"
          echo "Steps:     2"
          echo "Guide:     1.0"
          echo "=============================================="

      # ==========================================================
      # 2. CALLBACK - STARTING
      # ==========================================================

      - name: Callback - Starting
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback.json
          import json

          print(json.dumps({
              "status": "running",
              "progress": 2,
              "stage": "starting"
          }))
          PY

          curl -sS -f \
            --retry 3 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback.json

      # ==========================================================
      # 3. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 4. SYSTEM
      # ==========================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            git

          echo
          echo "System:"
          python3 --version
          ffmpeg -version | head -n 1
          git --version

      # ==========================================================
      # 5. HARDWARE
      # ==========================================================

      - name: Hardware check
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "HARDWARE"
          echo "=============================================="

          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "GPU:"

          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi || true
          else
            echo "No NVIDIA GPU detected."
          fi

      # ==========================================================
      # 6. CALLBACK - INSTALLING
      # ==========================================================

      - name: Callback - Installing
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback.json
          import json

          print(json.dumps({
              "status": "running",
              "progress": 7,
              "stage": "installing"
          }))
          PY

          curl -sS -f \
            --retry 3 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback.json

      # ==========================================================
      # 7. CLONE WAN2.1
      # ==========================================================

      - name: Clone Wan2.1
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Wan2.1

          git clone \
            --depth 1 \
            https://github.com/Wan-Video/Wan2.1.git \
            Wan2.1

          cd Wan2.1

          echo "Wan commit:"
          git rev-parse HEAD

      # ==========================================================
      # 8. GOLDEN CPU PATCH
      # ==========================================================

      - name: Apply golden CPU compatibility patch
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          python3 - <<'PY'
          from pathlib import Path

          print("==============================================")
          print("GOLDEN CPU PATCH")
          print("==============================================")

          # ------------------------------------------------------
          # T5
          # ------------------------------------------------------

          t5 = Path("wan/modules/t5.py")

          if not t5.exists():
              raise SystemExit("Missing wan/modules/t5.py")

          t5_text = t5.read_text()

          old = "device=torch.cuda.current_device()"
          new = "device='cpu'"

          if old in t5_text:
              t5_text = t5_text.replace(old, new, 1)
              t5.write_text(t5_text)
              print("OK: T5 CUDA default removed")
          else:
              print("OK: T5 CUDA default already absent")

          # ------------------------------------------------------
          # text2video
          # ------------------------------------------------------

          t2v = Path("wan/text2video.py")

          if not t2v.exists():
              raise SystemExit("Missing wan/text2video.py")

          text = t2v.read_text()

          # ------------------------------------------------------
          # CPU DEVICE
          # ------------------------------------------------------

          old_device = 'self.device = torch.device(f"cuda:{device_id}")'

          new_device = '''self.device = torch.device(
              "cuda" if torch.cuda.is_available() else "cpu"
          )'''

          if old_device in text:
              text = text.replace(old_device, new_device, 1)
              print("OK: CPU device selection patched")
          else:
              print("OK: device selection already patched")

          # ------------------------------------------------------
          # CPU SAFE AUTOCAST
          # ------------------------------------------------------

          old_autocast = (
              "with amp.autocast(dtype=self.param_dtype), "
              "torch.no_grad(), no_sync():"
          )

          new_autocast = '''with torch.autocast(
                  device_type=self.device.type,
                  dtype=self.param_dtype,
                  enabled=(self.device.type == "cuda")
              ), torch.no_grad(), no_sync():'''

          if old_autocast in text:
              text = text.replace(old_autocast, new_autocast, 1)
              print("OK: CPU autocast disabled")
          else:
              print("OK: autocast already patched")

          # ------------------------------------------------------
          # GOLDEN DTYPE FIX
          # ------------------------------------------------------

          old_context = '''context = [t.to(self.device) for t in context]
              context_null = [t.to(self.device) for t in context_null]'''

          new_context = '''context = [
                  t.to(
                      device=self.device,
                      dtype=torch.float32
                  )
                  for t in context
              ]

              context_null = [
                  t.to(
                      device=self.device,
                      dtype=torch.float32
                  )
                  for t in context_null
              ]'''

          if old_context in text:

              text = text.replace(
                  old_context,
                  new_context,
                  1
              )

              print("OK: T5 context BF16 -> FLOAT32")

          elif (
              "dtype=torch.float32" in text
              and "context_null" in text
          ):

              print("OK: context FLOAT32 conversion already present")

          else:

              raise SystemExit(
                  "ERROR: Could not locate context conversion."
              )

          # ------------------------------------------------------
          # CUDA CACHE
          # ------------------------------------------------------

          old_cache = "torch.cuda.empty_cache()"

          if old_cache in text:

              lines = text.splitlines()
              output = []

              for line in lines:

                  stripped = line.strip()

                  if stripped == old_cache:

                      indent = line[:len(line) - len(line.lstrip())]

                      output.append(
                          indent + "if torch.cuda.is_available():"
                      )

                      output.append(
                          indent + "    torch.cuda.empty_cache()"
                      )

                  else:

                      output.append(line)

              text = "\n".join(output) + "\n"

              print("OK: CUDA cache protection")

          # ------------------------------------------------------
          # CUDA SYNC
          # ------------------------------------------------------

          old_sync = "torch.cuda.synchronize()"

          if old_sync in text:

              lines = text.splitlines()
              output = []

              for line in lines:

                  stripped = line.strip()

                  if stripped == old_sync:

                      indent = line[:len(line) - len(line.lstrip())]

                      output.append(
                          indent + "if torch.cuda.is_available():"
                      )

                      output.append(
                          indent + "    torch.cuda.synchronize()"
                      )

                  else:

                      output.append(line)

              text = "\n".join(output) + "\n"

              print("OK: CUDA synchronize protection")

          t2v.write_text(text)

          # ------------------------------------------------------
          # VERIFY
          # ------------------------------------------------------

          print()
          print("==============================================")
          print("VERIFYING PATCH")
          print("==============================================")

          t5_text = t5.read_text()
          t2v_text = t2v.read_text()

          if "device=torch.cuda.current_device()" in t5_text:
              raise SystemExit(
                  "FAILED: T5 still uses CUDA default"
              )

          if 'self.device = torch.device(f"cuda:{device_id}")' in t2v_text:
              raise SystemExit(
                  "FAILED: WanT2V still forces CUDA"
              )

          if "dtype=torch.float32" not in t2v_text:
              raise SystemExit(
                  "FAILED: FLOAT32 context conversion missing"
              )

          print("T5 CPU:                 PASS")
          print("WanT2V CPU device:      PASS")
          print("CPU autocast:           PASS")
          print("Context FLOAT32:        PASS")
          print("CUDA cache protection:  PASS")
          print("CUDA sync protection:   PASS")

          print()
          print("==============================================")
          print("GOLDEN CPU PATCH PASSED")
          print("==============================================")
          PY

          echo
          echo "Python syntax verification..."

          python3 -m py_compile \
            wan/modules/t5.py \
            wan/text2video.py

          echo
          echo "SYNTAX: PASS"

      # ==========================================================
      # 9. PYTHON ENVIRONMENT
      # ==========================================================

      - name: Create Python environment
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      # ==========================================================
      # 10. CPU PYTORCH
      # ==========================================================

      - name: Install CPU PyTorch
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          python -m pip install \
            --no-cache-dir \
            torch \
            torchvision \
            --index-url https://download.pytorch.org/whl/cpu

          python - <<'PY'
          import torch

          print("==============================================")
          print("PYTORCH")
          print("==============================================")

          print("Torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())

          if torch.cuda.is_available():
              raise RuntimeError(
                  "Unexpected CUDA on CPU worker"
              )

          print("CPU PyTorch: PASS")
          PY

      # ==========================================================
      # 11. DEPENDENCIES
      # ==========================================================

      - name: Install Wan2.1 dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          python -m pip install \
            --no-cache-dir \
            einops \
            diffusers \
            transformers \
            tokenizers \
            accelerate \
            tqdm \
            imageio \
            easydict \
            ftfy \
            dashscope \
            imageio-ffmpeg \
            opencv-python \
            "numpy>=1.23.5,<2"

      # ==========================================================
      # 12. HUGGINGFACE
      # ==========================================================

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          python -m pip install \
            --no-cache-dir \
            "huggingface_hub[cli]"

          hf --help >/dev/null

      # ==========================================================
      # 13. IMPORT TEST
      # ==========================================================

      - name: Verify Wan2.1 imports
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          python - <<'PY'
          import sys
          import torch

          sys.path.insert(0, ".")

          print("==============================================")
          print("WAN2.1 IMPORT TEST")
          print("==============================================")

          print("Torch:", torch.__version__)
          print("CUDA:", torch.cuda.is_available())

          import wan

          print("wan import: PASS")

          from wan.modules.t5 import T5EncoderModel

          print("T5 import: PASS")

          from wan.text2video import WanT2V

          print("WanT2V import: PASS")

          print("IMPORT TEST: PASS")
          PY

      # ==========================================================
      # 14. CALLBACK - MODEL
      # ==========================================================

      - name: Callback - Model
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback.json
          import json

          print(json.dumps({
              "status": "running",
              "progress": 15,
              "stage": "downloading_model"
          }))
          PY

          curl -sS -f \
            --retry 3 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback.json

      # ==========================================================
      # 15. DOWNLOAD MODEL
      # ==========================================================

      - name: Download Wan2.1 T2V 1.3B
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          if [ -d "Wan2.1-T2V-1.3B" ]; then
            echo "Model directory already exists."
          else
            hf download \
              Wan-AI/Wan2.1-T2V-1.3B \
              --local-dir ./Wan2.1-T2V-1.3B
          fi

          echo
          echo "Model size:"
          du -sh ./Wan2.1-T2V-1.3B

      # ==========================================================
      # 16. MEMORY SAFETY
      # ==========================================================

      - name: Configure CPU memory safety
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "MEMORY BEFORE SWAP"
          echo "=============================================="

          free -h

          echo
          swapon --show || true

          if ! swapon --show --noheadings | grep -q .; then

            echo
            echo "Creating 12 GB swap..."

            sudo fallocate -l 12G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile

          else

            echo "Swap already available."

          fi

          echo
          echo "=============================================="
          echo "MEMORY AFTER SWAP"
          echo "=============================================="

          free -h

          echo
          echo "Swap:"
          swapon --show || true

      # ==========================================================
      # 17. CALLBACK - GENERATING
      # ==========================================================

      - name: Callback - Generating
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback.json
          import json

          print(json.dumps({
              "status": "running",
              "progress": 30,
              "stage": "generating"
          }))
          PY

          curl -sS -f \
            --retry 3 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback.json

      # ==========================================================
      # 18. GENERATION
      # ==========================================================

      - name: Generate Wan2.1 CPU proof video
        shell: bash
        run: |
          set -euo pipefail

          cd Wan2.1

          source .venv/bin/activate

          export OMP_NUM_THREADS=4
          export MKL_NUM_THREADS=4
          export TOKENIZERS_PARALLELISM=false

          FINAL_VIDEO="/tmp/${JOB_ID}.mp4"

          echo "=============================================="
          echo "GOLDEN WAN2.1 CPU GENERATION"
          echo "=============================================="

          echo "Prompt: ${PROMPT}"
          echo "Size:   ${SIZE}"
          echo "Frames: ${FRAME_NUM}"
          echo "Steps:  ${SAMPLE_STEPS}"
          echo "Guide:  ${GUIDE_SCALE}"

          echo
          echo "Memory:"
          free -h

          echo
          echo "Starting generation..."

          set +e

          python generate.py \
            --task t2v-1.3B \
            --size "${SIZE}" \
            --ckpt_dir ./Wan2.1-T2V-1.3B \
            --frame_num "${FRAME_NUM}" \
            --sample_steps "${SAMPLE_STEPS}" \
            --sample_shift 8 \
            --sample_guide_scale "${GUIDE_SCALE}" \
            --offload_model True \
            --t5_cpu \
            --prompt "${PROMPT}" \
            --save_file "${FINAL_VIDEO}" \
            2>&1 | tee /tmp/wan-generation.log

          GENERATE_EXIT=${PIPESTATUS[0]}

          set -e

          echo
          echo "Generation exit code: ${GENERATE_EXIT}"

          if [ "${GENERATE_EXIT}" -ne 0 ]; then

            echo
            echo "=============================================="
            echo "WAN2.1 GENERATION FAILED"
            echo "=============================================="

            tail -n 120 /tmp/wan-generation.log

            exit "${GENERATE_EXIT}"

          fi

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "ERROR: MP4 was not created."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "VIDEO CREATED"
          echo "=============================================="

          ls -lh "${FINAL_VIDEO}"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "${FINAL_VIDEO}"

          echo "FINAL_VIDEO=${FINAL_VIDEO}" >> "$GITHUB_ENV"

      # ==========================================================
      # 19. INSPECT FINAL VIDEO
      # ==========================================================

      - name: Inspect final video
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INSPECT FINAL VIDEO"
          echo "=============================================="

          test -f "${FINAL_VIDEO}"

          ls -lh "${FINAL_VIDEO}"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "${FINAL_VIDEO}"

          echo
          echo "FINAL VIDEO INSPECTION: PASS"

      # ==========================================================
      # 20. CALLBACK - UPLOADING
      # ==========================================================

      - name: Callback - Uploading
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback.json
          import json

          print(json.dumps({
              "status": "running",
              "progress": 80,
              "stage": "uploading"
          }))
          PY

          curl -sS -f \
            --retry 3 \
            --retry-delay 3 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback.json

      # ==========================================================
      # 21. UPLOAD
      # ==========================================================

      - name: Upload video to Render
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          test -f "${FINAL_VIDEO}"

          echo "Uploading:"
          ls -lh "${FINAL_VIDEO}"

          curl -sS -f \
            --retry 5 \
            --retry-delay 5 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/upload" \
            -H "Content-Type: video/mp4" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary "@${FINAL_VIDEO}"

          echo
          echo "UPLOAD: PASS"

      # ==========================================================
      # 22. COMPLETED
      # ==========================================================

      - name: Callback - Completed
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/callback.json
          import json
          import os

          print(json.dumps({
              "status": "completed",
              "progress": 100,
              "stage": "completed",
              "output_url":
                  os.environ["RENDER_BASE_URL"]
                  + "/api/jobs/"
                  + os.environ["JOB_ID"]
                  + "/video"
          }))
          PY

          cat /tmp/callback.json

          curl -sS -f \
            --retry 3 \
            --retry-delay 2 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/callback.json

          echo
          echo "=============================================="
          echo "GOLDEN WORKER COMPLETED"
          echo "=============================================="

      # ==========================================================
      # 23. FAILURE CALLBACK
      # ==========================================================

      - name: Callback - Failed
        if: failure()
        shell: bash
        run: |
          set +e

          python3 - <<'PY' > /tmp/failed.json
          import json

          print(json.dumps({
              "status": "failed",
              "progress": 0,
              "stage": "failed",
              "error":
                  "Wan2.1 CPU worker failed. "
                  "Check GitHub Actions logs."
          }))
          PY

          cat /tmp/failed.json

          if [ -n "${JOB_ID:-}" ]; then

            curl -sS \
              --retry 2 \
              -X POST \
              "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
              --data-binary @/tmp/failed.json \
              || true

          fi
