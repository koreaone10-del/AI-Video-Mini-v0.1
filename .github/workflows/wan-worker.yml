name: Wan2.1 T2V Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Render Job ID"
        required: true
        type: string

      prompt:
        description: "Video prompt"
        required: true
        type: string

      aspect_ratio:
        description: "Aspect ratio"
        required: true
        type: string
        default: "16:9"

      duration:
        description: "Requested duration in seconds"
        required: true
        type: string
        default: "5"

  repository_dispatch:
    types:
      - ai_video_job

permissions:
  contents: read

jobs:
  generate:
    name: Wan2.1 CPU Worker
    runs-on: ubuntu-24.04

    env:
      RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
      RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}

    steps:

      # ============================================================
      # 1. Prepare job variables
      # ============================================================
      - name: Prepare job variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            JOB_ID="${{ github.event.client_payload.job_id }}"
            PROMPT="${{ github.event.client_payload.prompt }}"
            ASPECT_RATIO="${{ github.event.client_payload.aspect_ratio }}"
            DURATION="${{ github.event.client_payload.duration }}"
          else
            JOB_ID="${{ inputs.job_id }}"
            PROMPT="${{ inputs.prompt }}"
            ASPECT_RATIO="${{ inputs.aspect_ratio }}"
            DURATION="${{ inputs.duration }}"
          fi

          case "$ASPECT_RATIO" in
            "16:9")
              SIZE="832*480"
              ;;
            "9:16")
              SIZE="480*832"
              ;;
            "1:1")
              SIZE="480*480"
              ;;
            *)
              echo "Unsupported aspect ratio: $ASPECT_RATIO"
              exit 1
              ;;
          esac

          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "PROMPT=$PROMPT" >> "$GITHUB_ENV"
          echo "ASPECT_RATIO=$ASPECT_RATIO" >> "$GITHUB_ENV"
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # CPU PROOF MODE
          #
          # Wan2.1 officially defaults to 81 frames for T2V.
          # We intentionally start with 9 frames and 4 steps to
          # prove that the CPU-compatible pipeline works first.
          #
          # 9 = 4n + 1, which satisfies Wan's frame constraint.
          # --------------------------------------------------------
          echo "FRAME_NUM=9" >> "$GITHUB_ENV"
          echo "SAMPLE_STEPS=4" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "Prepared Wan2.1 CPU job"
          echo "Job ID:        $JOB_ID"
          echo "Prompt:        $PROMPT"
          echo "Aspect:        $ASPECT_RATIO"
          echo "Duration:      $DURATION"
          echo "Size:          $SIZE"
          echo "Frame number:  9"
          echo "Sample steps:  4"
          echo "=============================================="

      # ============================================================
      # 2. Callback - Starting
      # ============================================================
      - name: Callback - Starting
        shell: bash
        run: |
          set -euo pipefail

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d "{
              \"status\": \"running\",
              \"progress\": 2,
              \"stage\": \"starting\",
              \"prompt\": $(python3 -c 'import json,os; print(json.dumps(os.environ[\"PROMPT\"]))'),
              \"aspect_ratio\": \"${ASPECT_RATIO}\",
              \"duration\": ${DURATION}
            }"

      # ============================================================
      # 3. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 4. Install system dependencies
      # ============================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            git \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            ca-certificates

          ffmpeg -version | head -n 1
          python3 --version
          git --version
          curl --version | head -n 1

      # ============================================================
      # 5. Hardware check
      # ============================================================
      - name: Check hardware
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Hardware"
          echo "=============================================="

          echo "CPU(s):"
          nproc

          echo
          echo "CPU model:"
          lscpu | grep -E "Model name|Socket|Core|Thread" | head -n 10 || true

          echo
          echo "RAM:"
          free -h

          echo
          echo "GPU:"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi || true
          else
            echo "No NVIDIA GPU detected."
          fi

          echo
          echo "This worker is configured for CPU-safe Wan2.1 execution."

      # ============================================================
      # 6. Callback - Installing Wan2.1
      # ============================================================
      - name: Callback - Installing Wan2.1
        shell: bash
        run: |
          set -euo pipefail

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "running",
              "progress": 8,
              "stage": "installing_wan"
            }'

      # ============================================================
      # 7. Clone official Wan2.1
      # ============================================================
      - name: Clone Wan2.1
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Wan2.1

          git clone \
            --depth 1 \
            https://github.com/Wan-Video/Wan2.1.git \
            Wan2.1

          cd Wan2.1

          echo "Wan2.1 commit:"
          git rev-parse HEAD

      # ============================================================
      # 8. Create Python environment
      # ============================================================
      - name: Create Python environment
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv .venv

          source .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          python --version
          pip --version

      # ============================================================
      # 9. Install CPU PyTorch
      # ============================================================
      - name: Install CPU PyTorch
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          python -m pip install \
            --no-cache-dir \
            torch \
            torchvision \
            --index-url https://download.pytorch.org/whl/cpu

          python - <<'PY'
          import torch

          print("==============================================")
          print("PyTorch CPU verification")
          print("==============================================")
          print("Torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("CUDA version:", torch.version.cuda)
          print("Device:", torch.device("cuda" if torch.cuda.is_available() else "cpu"))

          if torch.cuda.is_available():
              raise RuntimeError(
                  "CPU worker unexpectedly has CUDA enabled."
              )

          print("CPU PyTorch OK")
          PY

      # ============================================================
      # 10. Install Wan2.1 dependencies
      # ============================================================
      - name: Install Wan2.1 dependencies
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          cd Wan2.1

          python - <<'PY'
          from pathlib import Path

          source = Path("pyproject.toml")

          if not source.exists():
              raise SystemExit("Wan2.1 pyproject.toml not found.")

          lines = source.read_text().splitlines()

          blocked = {
              "torch",
              "torchvision",
              "flash_attn",
          }

          output = []

          for line in lines:
              stripped = line.strip()

              if not stripped:
                  output.append(line)
                  continue

              lower = stripped.lower()

              if any(
                  lower.startswith(f'"{name}"')
                  or lower.startswith(f"'{name}'")
                  or lower.startswith(f"{name}>")
                  or lower.startswith(f"{name}=")
                  or lower.startswith(f"{name}<")
                  or lower.startswith(f"{name} ")
                  for name in blocked
              ):
                  continue

              output.append(line)

          # The official project dependency list is extracted
          # through pip directly from the project.
          #
          # We deliberately install the CPU PyTorch build first,
          # so pip cannot replace it with a CUDA wheel.
          print("Preparing dependency installation...")

          PY

          python -m pip install \
            --no-cache-dir \
            einops \
            diffusers \
            transformers \
            tokenizers \
            accelerate \
            tqdm \
            imageio \
            easydict \
            ftfy \
            imageio-ffmpeg \
            opencv-python \
            "numpy>=1.23.5,<2"

          echo "Wan2.1 dependencies installed."

      # ============================================================
      # 11. Verify Wan2.1 installation
      # ============================================================
      - name: Verify Wan2.1 installation
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          cd Wan2.1

          python - <<'PY'
          import sys
          import torch

          sys.path.insert(0, ".")

          print("Torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())

          if torch.cuda.is_available():
              raise RuntimeError("CUDA unexpectedly enabled.")

          import wan

          print("Wan import: OK")
          print("CPU import test: OK")
          PY

      # ============================================================
      # 12. Install Hugging Face CLI
      # ============================================================
      - name: Install Hugging Face CLI
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          python -m pip install \
            --no-cache-dir \
            "huggingface_hub[cli]"

          hf --help >/dev/null

          echo "Hugging Face CLI: OK"

      # ============================================================
      # 13. Callback - Downloading model
      # ============================================================
      - name: Callback - Downloading model
        shell: bash
        run: |
          set -euo pipefail

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "running",
              "progress": 15,
              "stage": "downloading_model"
            }'

      # ============================================================
      # 14. Download Wan2.1 T2V 1.3B
      # ============================================================
      - name: Download Wan2.1 T2V 1.3B
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          cd Wan2.1

          rm -rf Wan2.1-T2V-1.3B

          hf download \
            Wan-AI/Wan2.1-T2V-1.3B \
            --local-dir ./Wan2.1-T2V-1.3B

          echo "Model download completed."

          du -sh ./Wan2.1-T2V-1.3B

      # ============================================================
      # 15. CPU compatibility patch
      # ============================================================
      - name: Patch Wan2.1 for CPU
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          cd Wan2.1

          python - <<'PY'
          from pathlib import Path

          # ========================================================
          # PATCH 1: t5.py
          #
          # Official Wan2.1 currently contains:
          #
          # device=torch.cuda.current_device()
          #
          # in the T5EncoderModel constructor default argument.
          #
          # Python evaluates that default while importing the module,
          # which crashes immediately with CPU-only PyTorch.
          # ========================================================

          t5 = Path("wan/modules/t5.py")

          text = t5.read_text()

          old = "device=torch.cuda.current_device(),"
          new = "device='cpu',"

          if old not in text:
              print("t5.py CUDA default already patched or changed.")
          else:
              text = text.replace(old, new, 1)
              t5.write_text(text)
              print("PATCHED: wan/modules/t5.py")

          # ========================================================
          # PATCH 2: text2video.py
          #
          # Force device selection based on torch.cuda availability.
          # ========================================================

          t2v = Path("wan/text2video.py")

          text = t2v.read_text()

          old = 'self.device = torch.device(f"cuda:{device_id}")'
          new = (
              'self.device = torch.device('
              '"cuda" if torch.cuda.is_available() else "cpu"'
              ')'
          )

          if old not in text:
              print("text2video.py device line already patched or changed.")
          else:
              text = text.replace(old, new, 1)

          # --------------------------------------------------------
          # CPU-safe autocast
          #
          # Official code imports torch.cuda.amp and uses:
          #
          # with amp.autocast(dtype=self.param_dtype)
          #
          # For CPU, use torch.autocast(device_type="cpu", ...).
          # --------------------------------------------------------

          old = "with amp.autocast(dtype=self.param_dtype), torch.no_grad(), no_sync():"

          new = """with torch.autocast(
                  device_type=self.device.type,
                  dtype=self.param_dtype,
                  enabled=(self.device.type == "cuda")
              ), torch.no_grad(), no_sync():"""

          if old in text:
              text = text.replace(old, new, 1)
          else:
              print("text2video autocast line already patched or changed.")

          # --------------------------------------------------------
          # Protect CUDA-only cache cleanup.
          # --------------------------------------------------------

          old = "            torch.cuda.empty_cache()"

          new = """            if torch.cuda.is_available():
                  torch.cuda.empty_cache()"""

          if old in text:
              text = text.replace(old, new, 1)
          else:
              print("empty_cache line already patched or changed.")

          # --------------------------------------------------------
          # Protect CUDA synchronization.
          # --------------------------------------------------------

          old = "        torch.cuda.synchronize()"

          new = """        if torch.cuda.is_available():
              torch.cuda.synchronize()"""

          if old in text:
              text = text.replace(old, new, 1)
          else:
              print("synchronize line already patched or changed.")

          t2v.write_text(text)

          print("PATCHED: wan/text2video.py")

          # ========================================================
          # Final verification of source patches
          # ========================================================

          t5_text = t5.read_text()
          t2v_text = t2v.read_text()

          if "device=torch.cuda.current_device()" in t5_text:
              raise SystemExit(
                  "CPU PATCH FAILED: t5.py still contains "
                  "torch.cuda.current_device()"
              )

          if 'self.device = torch.device(f"cuda:{device_id}")' in t2v_text:
              raise SystemExit(
                  "CPU PATCH FAILED: text2video.py still forces CUDA"
              )

          print("==============================================")
          print("Wan2.1 CPU patches verified")
          print("==============================================")
          PY

          echo
          echo "Relevant patched lines:"
          grep -n \
            -E "device='cpu'|self.device = torch.device|torch.autocast|empty_cache|synchronize" \
            wan/modules/t5.py \
            wan/text2video.py || true

      # ============================================================
      # 16. Verify CPU patched import
      # ============================================================
      - name: Verify patched Wan2.1
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          cd Wan2.1

          python - <<'PY'
          import sys
          import torch

          sys.path.insert(0, ".")

          print("Torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())

          if torch.cuda.is_available():
              raise RuntimeError("CUDA is unexpectedly available.")

          import wan
          from wan.modules.t5 import T5EncoderModel

          print("Wan import: OK")
          print("T5 import: OK")
          print("CPU compatibility import test: PASSED")
          PY

      # ============================================================
      # 17. Callback - Generating
      # ============================================================
      - name: Callback - Generating
        shell: bash
        run: |
          set -euo pipefail

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "running",
              "progress": 30,
              "stage": "generating"
            }'

      # ============================================================
      # 18. Generate CPU proof video
      # ============================================================
      - name: Generate Wan2.1 CPU proof video
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          cd Wan2.1

          export OMP_NUM_THREADS=4
          export MKL_NUM_THREADS=4
          export TOKENIZERS_PARALLELISM=false

          FINAL_VIDEO="/tmp/${JOB_ID}.mp4"

          echo "=============================================="
          echo "Wan2.1 CPU generation"
          echo "=============================================="
          echo "Job:          ${JOB_ID}"
          echo "Prompt:       ${PROMPT}"
          echo "Aspect:       ${ASPECT_RATIO}"
          echo "Size:         ${SIZE}"
          echo "Frames:       ${FRAME_NUM}"
          echo "Steps:        ${SAMPLE_STEPS}"
          echo "Mode:         CPU"
          echo "=============================================="

          python generate.py \
            --task t2v-1.3B \
            --size "$SIZE" \
            --ckpt_dir ./Wan2.1-T2V-1.3B \
            --frame_num "$FRAME_NUM" \
            --sample_steps "$SAMPLE_STEPS" \
            --sample_shift 8 \
            --sample_guide_scale 6 \
            --prompt "$PROMPT" \
            --save_file "$FINAL_VIDEO"

          if [ ! -f "$FINAL_VIDEO" ]; then
            echo "Generation finished but MP4 was not created."
            exit 1
          fi

          echo
          echo "Generated file:"
          ls -lh "$FINAL_VIDEO"

          echo
          echo "Video information:"
          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$FINAL_VIDEO"

          echo "FINAL_VIDEO=$FINAL_VIDEO" >> "$GITHUB_ENV"

      # ============================================================
      # 19. Inspect final video
      # ============================================================
      - name: Inspect final video
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "Final video missing."
            exit 1
          fi

          echo "Final video exists:"
          ls -lh "${FINAL_VIDEO}"

          ffprobe \
            -v error \
            -show_entries \
            format=duration \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "${FINAL_VIDEO}"

      # ============================================================
      # 20. Callback - Uploading
      # ============================================================
      - name: Callback - Uploading
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d '{
              "status": "running",
              "progress": 80,
              "stage": "uploading"
            }'

      # ============================================================
      # 21. Upload video to Render
      # ============================================================
      - name: Upload video to Render
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "FINAL_VIDEO does not exist."
            exit 1
          fi

          curl -sS -f \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/upload" \
            -H "Content-Type: video/mp4" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary "@${FINAL_VIDEO}"

          echo
          echo "Video uploaded successfully."

      # ============================================================
      # 22. Callback - Completed
      # ============================================================
      - name: Callback - Completed
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/completed.json <<EOF
          {
            "status": "completed",
            "progress": 100,
            "stage": "completed",
            "output_url": "${RENDER_BASE_URL}/api/jobs/${JOB_ID}/video"
          }
          EOF

          cat /tmp/completed.json

          curl -sS -f \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary @/tmp/completed.json

      # ============================================================
      # 23. Callback - Failed
      # ============================================================
      - name: Callback - Failed
        if: failure()
        shell: bash
        run: |
          set +e

          ERROR_MESSAGE="GitHub Actions Wan2.1 worker failed."

          curl -sS \
            -X POST \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${RENDER_CALLBACK_SECRET}" \
            -d "{
              \"status\": \"failed\",
              \"progress\": 0,
              \"stage\": \"failed\",
              \"error\": \"${ERROR_MESSAGE}\"
            }" || true
