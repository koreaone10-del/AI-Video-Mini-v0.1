name: Wan2.1 T2V Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Render Job ID"
        required: true
        type: string

      prompt:
        description: "Video prompt"
        required: true
        type: string

      aspect_ratio:
        description: "Aspect ratio"
        required: false
        default: "16:9"
        type: string

      duration:
        description: "Requested duration in seconds"
        required: false
        default: "5"
        type: string

  repository_dispatch:
    types:
      - ai_video_job

permissions:
  contents: read

env:
  RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
  RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}

jobs:
  wan_cpu_worker:
    name: Wan2.1 CPU Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      JOB_ID: ${{ github.event.inputs.job_id || github.event.client_payload.job_id }}
      PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt }}
      ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio || github.event.client_payload.aspect_ratio || '16:9' }}
      DURATION: ${{ github.event.inputs.duration || github.event.client_payload.duration || '5' }}

      VIDEOGEN_MODEL: wan21-t2v-1.3b

      # ============================================================
      # GOLDEN CPU CONFIGURATION
      # Keep this stable until the MP4 pipeline is proven end-to-end.
      # ============================================================
      FRAME_WIDTH: "256"
      FRAME_HEIGHT: "256"
      FRAME_COUNT: "9"

      # Draft preset automatically selects the 4-step
      # self-forcing DMD LoRA for Wan 2.1 1.3B.
      VIDEO_PRESET: "draft"

      OUTPUT_DIR: /tmp/wan-output
      FINAL_VIDEO: /tmp/wan-output/final.mp4

      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"

      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"

    steps:

      # ============================================================
      # 1. STARTING
      # ============================================================
      - name: Callback - Starting
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "WAN2.1 GOLDEN CPU WORKER"
          echo "============================================================"
          echo "Job ID:       ${JOB_ID}"
          echo "Prompt:       ${PROMPT}"
          echo "Aspect:       ${ASPECT_RATIO}"
          echo "Duration:     ${DURATION}s"
          echo "Model:        ${VIDEOGEN_MODEL}"
          echo "Preset:       ${VIDEO_PRESET}"
          echo "Resolution:   ${FRAME_WIDTH}x${FRAME_HEIGHT}"
          echo "Frames:       ${FRAME_COUNT}"
          echo "============================================================"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
            -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -d @- <<JSON
          {
            "status": "processing",
            "stage": "starting",
            "progress": 2,
            "message": "Worker started",
            "job_id": "${JOB_ID}"
          }
          JSON

      # ============================================================
      # 2. SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          echo "Installing system dependencies..."

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            git \
            curl \
            ca-certificates \
            build-essential \
            python3 \
            python3-venv \
            python3-pip \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1

          echo
          echo "Python:"
          python3 --version

          echo
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo
          echo "Git:"
          git --version

      # ============================================================
      # 3. HARDWARE CHECK
      # ============================================================
      - name: Hardware check
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "HARDWARE"
          echo "============================================================"

          echo
          echo "CPU:"
          lscpu | grep -E \
            'Model name|CPU\(s\)|Thread|Core|Socket|Architecture' \
            || true

          echo
          echo "RAM:"
          free -h

          echo
          echo "SWAP:"
          swapon --show || true

          echo
          echo "GPU:"
          nvidia-smi || echo "No NVIDIA GPU available - CPU mode"

          echo
          echo "Disk:"
          df -h /

          echo
          echo "AVX:"
          grep -m1 '^flags' /proc/cpuinfo | grep -oE 'avx[^ ]*' | sort -u || true

      # ============================================================
      # 4. CALLBACK INSTALLING
      # ============================================================
      - name: Callback - Installing
        shell: bash
        run: |
          set -e

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
            -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -d @- <<JSON
          {
            "status": "processing",
            "stage": "installing",
            "progress": 7,
            "message": "Preparing CPU video engine"
          }
          JSON

      # ============================================================
      # 5. CLONE VIDEOGEN
      # ============================================================
      - name: Clone videogen
        shell: bash
        run: |
          set -e

          rm -rf videogen

          git clone \
            --depth 1 \
            https://github.com/mkamranr/videogen.git \
            videogen

          cd videogen

          echo
          echo "videogen commit:"
          git rev-parse HEAD

          echo
          echo "Repository:"
          ls -la

      # ============================================================
      # 6. CREATE PYTHON ENVIRONMENT
      # ============================================================
      - name: Create Python environment
        shell: bash
        run: |
          set -e

          python3 -m venv .venv

          source .venv/bin/activate

          python --version
          pip --version

          python -m pip install --upgrade pip setuptools wheel

      # ============================================================
      # 7. INSTALL CPU PYTORCH
      # ============================================================
      - name: Install CPU PyTorch
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          echo "Installing CPU-only PyTorch..."

          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch

          python - <<'PY'
          import torch

          print("============================================================")
          print("PYTORCH")
          print("============================================================")
          print("Version:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("Device count:", torch.cuda.device_count())
          print("============================================================")
          PY

      # ============================================================
      # 8. INSTALL VIDEOGEN CPU BACKEND
      # ============================================================
      - name: Install videogen CPU backend
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          cd videogen

          python -m pip install -e '.[cpu]'

          echo
          echo "videogen:"
          videogen --help | head -n 25

      # ============================================================
      # 8.5. INSTALL PEFT REQUIRED BY THE DRAFT LORA
      # ============================================================
      - name: Install and verify PEFT backend
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          python -m pip install peft

          python - <<'PY'
          import peft
          from diffusers.utils import USE_PEFT_BACKEND

          if not USE_PEFT_BACKEND:
              raise SystemExit("Diffusers did not enable its PEFT backend")

          print("PEFT version:", peft.__version__)
          print("Diffusers PEFT backend: enabled")
          PY

      # ============================================================
      # 9. VERIFY VIDEOGEN
      # ============================================================
      - name: Verify videogen
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          cd videogen

          echo "============================================================"
          echo "VIDEOGEN DOCTOR"
          echo "============================================================"

          videogen doctor \
            --refresh \
            --mode t2v

      # ============================================================
      # 10. CALLBACK MODEL
      # ============================================================
      - name: Callback - Model
        shell: bash
        run: |
          set -e

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
            -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -d @- <<JSON
          {
            "status": "processing",
            "stage": "model",
            "progress": 15,
            "message": "Preparing quantized Wan 2.1 1.3B CPU model"
          }
          JSON

      # ============================================================
      # 11. SHOW MODEL
      # ============================================================
      - name: Inspect Wan model
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          cd videogen

          echo "============================================================"
          echo "MODEL"
          echo "============================================================"

          videogen models show "${VIDEOGEN_MODEL}"

      # ============================================================
      # 12. DOWNLOAD MODEL
      # ============================================================
      - name: Download Wan CPU model
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          cd videogen

          mkdir -p /tmp/videogen-models
          mkdir -p /tmp/wan-output

          export VIDEOGEN_MODEL_DIR=/tmp/videogen-models
          export VIDEOGEN_OUTPUT_DIR=/tmp/wan-output

          echo "============================================================"
          echo "DOWNLOADING CPU MODEL"
          echo "============================================================"
          echo "Model: ${VIDEOGEN_MODEL}"
          echo "Preset: ${VIDEO_PRESET}"
          echo "============================================================"

          videogen models pull \
            "${VIDEOGEN_MODEL}" \
            --mode t2v \
            --preset "${VIDEO_PRESET}"

      # ============================================================
      # 13. PLAN
      # ============================================================
      - name: Build execution plan
        shell: bash
        run: |
          set -e

          source .venv/bin/activate

          cd videogen

          export VIDEOGEN_MODEL_DIR=/tmp/videogen-models
          export VIDEOGEN_OUTPUT_DIR=/tmp/wan-output

          echo "============================================================"
          echo "EXECUTION PLAN"
          echo "============================================================"

          videogen plan \
            "${PROMPT}" \
            --model "${VIDEOGEN_MODEL}" \
            --mode t2v \
            --preset "${VIDEO_PRESET}" \
            --width "${FRAME_WIDTH}" \
            --height "${FRAME_HEIGHT}" \
            --frames "${FRAME_COUNT}" \
            --allow-slow

      # ============================================================
      # 14. CALLBACK GENERATING
      # ============================================================
      - name: Callback - Generating
        shell: bash
        run: |
          set -e

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
            -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -d @- <<JSON
          {
            "status": "processing",
            "stage": "generating",
            "progress": 30,
            "message": "Generating video on CPU with quantized Wan 2.1"
          }
          JSON

      # ============================================================
      # 14.5. ADD TEMPORARY SWAP FOR MODEL LOADING
      # ============================================================
      - name: Configure temporary swap
        shell: bash
        run: |
          set -e

          echo "Swap before configuration:"
          swapon --show

          if ! swapon --show=NAME --noheadings | grep -q '^/swapfile-ai-video$'; then
            sudo fallocate -l 16G /swapfile-ai-video
            sudo chmod 600 /swapfile-ai-video
            sudo mkswap /swapfile-ai-video
            sudo swapon /swapfile-ai-video
          fi

          echo
          echo "Memory and swap available for model loading:"
          free -h

      # ============================================================
      # 15. GENERATION HEARTBEAT
      # ============================================================
      - name: Start generation heartbeat
        shell: bash
        run: |
          set -e

          (
            progress=32

            while true; do
              sleep 30

              if [ -f /tmp/wan-generation-finished ]; then
                break
              fi

              if [ "${progress}" -lt 75 ]; then
                progress=$((progress + 2))
              fi

              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 20 \
                -X POST \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
                -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
                -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
                "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
                -d @- <<JSON || true
          {
            "status": "processing",
            "stage": "generating",
            "progress": ${progress},
            "message": "CPU generation still running"
          }
          JSON
            done
          ) &

          echo $! > /tmp/wan-heartbeat.pid

      # ============================================================
      # 16. GENERATE VIDEO
      # ============================================================
      - name: Generate Wan2.1 video
        shell: bash
        run: |
          set +e

          source .venv/bin/activate

          cd videogen

          export VIDEOGEN_MODEL_DIR=/tmp/videogen-models
          export VIDEOGEN_OUTPUT_DIR=/tmp/wan-output

          mkdir -p /tmp/wan-output

          rm -f /tmp/wan-generation-finished
          rm -f /tmp/wan-generation.log

          echo "============================================================"
          echo "GOLDEN WAN2.1 CPU GENERATION"
          echo "============================================================"
          echo "Job:        ${JOB_ID}"
          echo "Prompt:     ${PROMPT}"
          echo "Model:      ${VIDEOGEN_MODEL}"
          echo "Preset:     ${VIDEO_PRESET}"
          echo "Aspect:     ${ASPECT_RATIO}"
          echo "Requested:  ${DURATION}s"
          echo "Resolution: ${FRAME_WIDTH}x${FRAME_HEIGHT}"
          echo "Frames:     ${FRAME_COUNT}"
          echo "============================================================"

          echo
          echo "Memory before generation:"
          free -h

          echo
          echo "Disk before generation:"
          df -h /

          echo
          echo "Starting videogen..."

          videogen t2v \
            "${PROMPT}" \
            --model "${VIDEOGEN_MODEL}" \
            --preset "${VIDEO_PRESET}" \
            --width "${FRAME_WIDTH}" \
            --height "${FRAME_HEIGHT}" \
            --frames "${FRAME_COUNT}" \
            --output "${FINAL_VIDEO}" \
            --allow-slow \
            --plan \
            2>&1 | tee /tmp/wan-generation.log

          GENERATION_EXIT=${PIPESTATUS[0]}

          touch /tmp/wan-generation-finished

          if [ -f /tmp/wan-heartbeat.pid ]; then
            kill "$(cat /tmp/wan-heartbeat.pid)" 2>/dev/null || true
          fi

          echo
          echo "Generation exit code: ${GENERATION_EXIT}"

          if [ "${GENERATION_EXIT}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "GENERATION FAILED"
            echo "============================================================"

            tail -n 200 /tmp/wan-generation.log || true

            exit "${GENERATION_EXIT}"
          fi

          echo
          echo "Generation completed."

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "ERROR: Expected output does not exist:"
            echo "${FINAL_VIDEO}"
            exit 1
          fi

          if [ ! -s "${FINAL_VIDEO}" ]; then
            echo "ERROR: Output file is empty."
            exit 1
          fi

          echo
          echo "Output:"
          ls -lh "${FINAL_VIDEO}"

      # ============================================================
      # 17. STOP HEARTBEAT
      # ============================================================
      - name: Stop generation heartbeat
        if: always()
        shell: bash
        run: |
          set +e

          touch /tmp/wan-generation-finished

          if [ -f /tmp/wan-heartbeat.pid ]; then
            kill "$(cat /tmp/wan-heartbeat.pid)" 2>/dev/null || true
          fi

      # ============================================================
      # 18. INSPECT AND VALIDATE VIDEO
      # ============================================================
      - name: Inspect final video
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "FINAL VIDEO INSPECTION"
          echo "============================================================"

          if [ ! -f "${FINAL_VIDEO}" ]; then
            echo "ERROR: Video file not found."
            exit 1
          fi

          if [ ! -s "${FINAL_VIDEO}" ]; then
            echo "ERROR: Video file is empty."
            exit 1
          fi

          echo
          echo "File:"
          ls -lh "${FINAL_VIDEO}"

          echo
          echo "FFprobe full information:"

          ffprobe \
            -hide_banner \
            -v error \
            -show_entries \
            format=filename,size,duration,format_name \
            -show_entries \
            stream=index,codec_name,codec_type,width,height,r_frame_rate,nb_frames \
            -of json \
            "${FINAL_VIDEO}"

          echo
          echo "------------------------------------------------------------"
          echo "Checking video stream..."
          echo "------------------------------------------------------------"

          VIDEO_STREAM="$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of csv=p=0 \
            "${FINAL_VIDEO}" || true)"

          if [ -z "${VIDEO_STREAM}" ]; then
            echo "ERROR: No valid video stream found."
            exit 1
          fi

          echo "Video stream:"
          echo "${VIDEO_STREAM}"

          echo
          echo "------------------------------------------------------------"
          echo "Checking duration..."
          echo "------------------------------------------------------------"

          VIDEO_DURATION="$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "${FINAL_VIDEO}" | tr -d '\r' || true)"

          echo "Detected duration: ${VIDEO_DURATION}"

          if [ -z "${VIDEO_DURATION}" ]; then
            echo "ERROR: Video duration is missing."
            exit 1
          fi

          if ! awk "BEGIN { exit !(${VIDEO_DURATION} > 0) }"; then
            echo "ERROR: Video duration is zero or invalid."
            exit 1
          fi

          echo
          echo "------------------------------------------------------------"
          echo "Counting decoded video frames..."
          echo "------------------------------------------------------------"

          FRAME_COUNT_ACTUAL="$(ffprobe \
            -v error \
            -select_streams v:0 \
            -count_frames \
            -show_entries stream=nb_read_frames \
            -of default=noprint_wrappers=1:nokey=1 \
            "${FINAL_VIDEO}" | head -n 1 | tr -d '\r' || true)"

          echo "Decoded frames: ${FRAME_COUNT_ACTUAL}"

          if [ -z "${FRAME_COUNT_ACTUAL}" ] || [ "${FRAME_COUNT_ACTUAL}" = "N/A" ]; then
            echo "ERROR: Could not determine decoded frame count."
            exit 1
          fi

          if ! awk "BEGIN { exit !(${FRAME_COUNT_ACTUAL} > 0) }"; then
            echo "ERROR: Video contains zero decoded frames."
            exit 1
          fi

          echo
          echo "------------------------------------------------------------"
          echo "Decoding test..."
          echo "------------------------------------------------------------"

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -i "${FINAL_VIDEO}" \
            -map 0:v:0 \
            -f null \
            -

          echo
          echo "============================================================"
          echo "VIDEO VALIDATION PASSED"
          echo "============================================================"
          echo "Duration: ${VIDEO_DURATION}s"
          echo "Frames:   ${FRAME_COUNT_ACTUAL}"
          echo "============================================================"

      # ============================================================
      # 19. CALLBACK UPLOADING
      # ============================================================
      - name: Callback - Uploading
        shell: bash
        run: |
          set -e

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
            -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -d @- <<JSON
          {
            "status": "processing",
            "stage": "uploading",
            "progress": 80,
            "message": "Uploading validated MP4 to Render"
          }
          JSON

      # ============================================================
      # 20. UPLOAD VIDEO - RAW MP4 ONLY
      # ============================================================
      - name: Upload video to Render
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "UPLOADING VIDEO TO RENDER"
          echo "============================================================"

          echo
          echo "Local file:"
          ls -lh "${FINAL_VIDEO}"

          UPLOAD_URL="${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/upload"

          echo
          echo "Upload endpoint:"
          echo "${UPLOAD_URL}"

          echo
          echo "Uploading raw video/mp4..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 30 \
            --max-time 600 \
            -X POST \
            -H "Content-Type: video/mp4" \
            -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
            -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            --data-binary "@${FINAL_VIDEO}" \
            "${UPLOAD_URL}" \
            | tee /tmp/upload-response.json

          echo
          echo "============================================================"
          echo "UPLOAD RESPONSE"
          echo "============================================================"

          cat /tmp/upload-response.json

          echo
          echo "Raw MP4 upload completed successfully."

      # ============================================================
      # 21. VERIFY VIDEO ON RENDER
      # ============================================================
      - name: Verify video on Render
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "END-TO-END VIDEO VERIFICATION"
          echo "============================================================"

          VIDEO_URL="${RENDER_BASE_URL}/api/jobs/${JOB_ID}/video"
          VERIFY_FILE="/tmp/render-verified-${JOB_ID}.mp4"

          rm -f "${VERIFY_FILE}"

          echo
          echo "Video URL:"
          echo "${VIDEO_URL}"

          echo
          echo "Downloading video from Render for verification..."

          HTTP_STATUS="$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 30 \
            --max-time 600 \
            --output "${VERIFY_FILE}" \
            --write-out "%{http_code}" \
            "${VIDEO_URL}")"

          echo
          echo "HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: Render video endpoint did not return HTTP 200."
            exit 1
          fi

          if [ ! -f "${VERIFY_FILE}" ]; then
            echo "ERROR: Verification file was not downloaded."
            exit 1
          fi

          if [ ! -s "${VERIFY_FILE}" ]; then
            echo "ERROR: Render returned an empty video."
            exit 1
          fi

          echo
          echo "Downloaded Render video:"
          ls -lh "${VERIFY_FILE}"

          echo
          echo "Render video FFprobe:"

          ffprobe \
            -hide_banner \
            -v error \
            -show_entries \
            format=filename,size,duration,format_name \
            -show_entries \
            stream=index,codec_name,codec_type,width,height,r_frame_rate,nb_frames \
            -of json \
            "${VERIFY_FILE}"

          echo
          echo "------------------------------------------------------------"
          echo "Checking Render video stream..."
          echo "------------------------------------------------------------"

          RENDER_VIDEO_STREAM="$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of csv=p=0 \
            "${VERIFY_FILE}" || true)"

          if [ -z "${RENDER_VIDEO_STREAM}" ]; then
            echo "ERROR: Render returned no valid video stream."
            exit 1
          fi

          echo "Render video stream:"
          echo "${RENDER_VIDEO_STREAM}"

          echo
          echo "------------------------------------------------------------"
          echo "Checking Render video duration..."
          echo "------------------------------------------------------------"

          RENDER_DURATION="$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "${VERIFY_FILE}" | tr -d '\r' || true)"

          echo "Render duration: ${RENDER_DURATION}"

          if [ -z "${RENDER_DURATION}" ]; then
            echo "ERROR: Render video duration is missing."
            exit 1
          fi

          if ! awk "BEGIN { exit !(${RENDER_DURATION} > 0) }"; then
            echo "ERROR: Render video duration is zero or invalid."
            exit 1
          fi

          echo
          echo "------------------------------------------------------------"
          echo "Counting Render video frames..."
          echo "------------------------------------------------------------"

          RENDER_FRAME_COUNT="$(ffprobe \
            -v error \
            -select_streams v:0 \
            -count_frames \
            -show_entries stream=nb_read_frames \
            -of default=noprint_wrappers=1:nokey=1 \
            "${VERIFY_FILE}" | head -n 1 | tr -d '\r' || true)"

          echo "Render decoded frames: ${RENDER_FRAME_COUNT}"

          if [ -z "${RENDER_FRAME_COUNT}" ] || [ "${RENDER_FRAME_COUNT}" = "N/A" ]; then
            echo "ERROR: Could not determine Render video frame count."
            exit 1
          fi

          if ! awk "BEGIN { exit !(${RENDER_FRAME_COUNT} > 0) }"; then
            echo "ERROR: Render video contains zero decoded frames."
            exit 1
          fi

          echo
          echo "------------------------------------------------------------"
          echo "Decoding Render video..."
          echo "------------------------------------------------------------"

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -i "${VERIFY_FILE}" \
            -map 0:v:0 \
            -f null \
            -

          echo
          echo "============================================================"
          echo "RENDER VIDEO VERIFICATION PASSED"
          echo "============================================================"
          echo "HTTP:       ${HTTP_STATUS}"
          echo "Duration:   ${RENDER_DURATION}s"
          echo "Frames:     ${RENDER_FRAME_COUNT}"
          echo "Video URL:  ${VIDEO_URL}"
          echo "============================================================"

      # ============================================================
      # 22. COMPLETED
      # ============================================================
      - name: Callback - Completed
        shell: bash
        run: |
          set -e

          VIDEO_URL="${RENDER_BASE_URL}/api/jobs/${JOB_ID}/video"

          echo "============================================================"
          echo "JOB COMPLETED"
          echo "============================================================"
          echo "Job:"
          echo "${JOB_ID}"
          echo
          echo "Video:"
          echo "${VIDEO_URL}"
          echo "============================================================"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
            -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -d @- <<JSON
          {
            "status": "completed",
            "stage": "completed",
            "progress": 100,
            "message": "Video generation completed successfully",
            "video_url": "${VIDEO_URL}",
            "output_url": "${VIDEO_URL}",
            "job_id": "${JOB_ID}"
          }
          JSON

      # ============================================================
      # 23. FAILURE CALLBACK
      # ============================================================
      - name: Callback - Failed
        if: failure()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "WORKER FAILED"
          echo "============================================================"

          ERROR_MESSAGE="Wan2.1 CPU worker failed"

          if [ -f /tmp/wan-generation.log ]; then
            ERROR_TAIL="$(tail -n 30 /tmp/wan-generation.log | tr '\n' ' ' | sed 's/"/\\"/g')"
            ERROR_MESSAGE="${ERROR_MESSAGE}: ${ERROR_TAIL}"
          fi

          curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_CALLBACK_SECRET}" \
            -H "x-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            -H "x-render-callback-secret: ${RENDER_CALLBACK_SECRET}" \
            "${RENDER_BASE_URL}/api/worker/jobs/${JOB_ID}/callback" \
            -d @- <<JSON || true
          {
            "status": "failed",
            "stage": "failed",
            "progress": 0,
            "message": "${ERROR_MESSAGE}",
            "job_id": "${JOB_ID}"
          }
          JSON

          echo
          echo "Failure callback sent."

      # ============================================================
      # 24. FINAL DIAGNOSTICS
      # ============================================================
      - name: Final diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "FINAL WORKER DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "RAM:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Output directory:"
          ls -lah /tmp/wan-output 2>/dev/null || true

          echo
          echo "Generation log:"

          if [ -f /tmp/wan-generation.log ]; then
            tail -n 100 /tmp/wan-generation.log
          else
            echo "No generation log."
          fi

          echo
          echo "Upload response:"

          if [ -f /tmp/upload-response.json ]; then
            cat /tmp/upload-response.json
          else
            echo "No upload response."
          fi

          echo
          echo "============================================================"
          echo "END OF DIAGNOSTICS"
          echo "============================================================"
